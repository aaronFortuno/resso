<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practica la lectura en veu alta amb seguiment del text i transcripció al navegador.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ressò · ortogra.fi</title>
  <link rel="icon" href="./assets/resso.svg" type="image/svg+xml">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#passage-scroll" data-copy="skip"></a>
  <header class="masthead">
    <div class="bar">
      <div class="identity">
        <img src="./assets/resso.svg" width="38" height="38" alt="">
        <h1>Ressò</h1>
        <span data-copy="subtitle"></span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-switch" type="button" role="switch" aria-checked="false" data-label="darkTheme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A8 8 0 0 1 9 4a8.5 8.5 0 1 0 11 11Z"/></svg>
        </button>
        <button class="language-toggle" type="button" popovertarget="ui-language" data-label="interfaceLanguage">
          <span data-copy="catalan"></span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <div id="ui-language" popover>
          <p data-copy="interfaceLanguage"></p>
          <ul>
            <li><span aria-current="true" data-copy="catalan"></span></li>
            <li><span aria-disabled="true" lang="es">Castellano</span></li>
            <li><span aria-disabled="true" lang="eu">Euskara</span></li>
            <li><span aria-disabled="true" lang="gl">Galego</span></li>
          </ul>
          <p class="language-note" data-copy="languageSoon"></p>
        </div>
      </div>
    </div>
  </header>
  <main class="workspace">
    <aside class="controls panel" aria-labelledby="controls-title">
      <div class="controls-scroll scrollable">
        <h2 id="controls-title" data-copy="controls"></h2>
        <fieldset id="settings">
          <div class="field">
            <label for="reading-language" data-copy="readingLanguage"></label>
            <select id="reading-language">
              <option value="ca" data-copy="catalan"></option>
              <option value="es" lang="es" disabled>Castellano</option>
              <option value="eu" lang="eu" disabled>Euskara</option>
              <option value="gl" lang="gl" disabled>Galego</option>
            </select>
          </div>
          <div class="field">
            <label for="passage-choice" data-copy="readingText"></label>
            <select id="passage-choice"></select>
          </div>
          <div class="field">
            <label for="duration" data-copy="duration"></label>
            <select id="duration">
              <option value="30" data-copy="duration30"></option>
              <option value="60" data-copy="duration60" selected></option>
              <option value="90" data-copy="duration90"></option>
              <option value="120" data-copy="duration120"></option>
            </select>
          </div>
          <details class="timing-options">
            <summary data-copy="timingOptions"></summary>
            <div>
              <div class="field">
                <p class="field-title" data-copy="startWord"></p>
                <p class="field-note" id="start-word-label" role="status"></p>
                <div class="start-actions">
                  <button id="choose-start" type="button" aria-pressed="false" aria-controls="passage" aria-describedby="start-word-label start-help" data-copy="chooseStart"></button>
                  <button id="reset-start" type="button" data-copy="resetStart" disabled></button>
                </div>
                <p class="field-note" id="start-help" data-copy="startHelp"></p>
              </div>
              <label class="check"><input type="checkbox" id="end-sound"><span data-copy="endSound"></span></label>
              <label class="check"><input type="checkbox" id="finish-sentence" aria-describedby="sentence-help"><span data-copy="finishSentence"></span></label>
              <p class="field-note" id="sentence-help" data-copy="sentenceHelp"></p>
            </div>
          </details>
        </fieldset>
        <section class="report" id="report" aria-labelledby="report-title" hidden>
          <h3 id="report-title" tabindex="-1" data-copy="report"></h3>
          <p id="report-note"></p>
          <dl class="metrics" id="metrics" hidden>
            <div><dt data-copy="correctRate"></dt><dd id="rate"></dd></div>
            <div><dt data-copy="possibleErrors"></dt><dd id="errors"></dd></div>
            <div><dt data-copy="possibleRepairs"></dt><dd id="repairs"></dd></div>
            <div id="reread-metric" hidden><dt data-copy="rereads"></dt><dd id="reread-count"></dd></div>
          </dl>
          <ul class="details" id="details" hidden></ul>
        </section>
      </div>
      <div class="session-bar">
        <div class="clock">
          <span id="clock" aria-hidden="true">1:00</span>
          <progress id="progress" max="60" value="60" data-label="time"></progress>
        </div>
        <p class="status" id="status" role="status" data-copy="initial"></p>
        <button id="action" type="button" data-copy="initialButton" disabled></button>
        <noscript><p>Activa el JavaScript per fer servir el micròfon.</p></noscript>
      </div>
    </aside>
    <article class="paper panel" aria-labelledby="passage-title">
      <header class="panel-heading">
        <h2 id="passage-title"></h2>
        <p id="pick-start-help" data-copy="pickStartHelp" hidden></p>
        <label class="follow">
          <input id="follow" type="checkbox" checked>
          <span data-copy="follow"></span>
        </label>
      </header>
      <div id="passage-scroll" class="scrollable" tabindex="0" role="region" aria-labelledby="passage-title">
        <div id="passage"></div>
      </div>
      <ul class="legend" data-label="legend" tabindex="0">
        <li><span data-reading="match" data-copy="match"></span></li>
        <li><span data-reading="substitution" data-copy="substitution"></span></li>
        <li><span data-reading="omission" data-copy="omission"></span></li>
        <li><span data-reading="reread" data-copy="reread"></span></li>
        <li><span data-reading="corrected" data-copy="corrected"></span></li>
        <li><span data-provisional data-copy="provisional"></span></li>
      </ul>
    </article>
    <section class="transcript panel" aria-labelledby="transcript-title">
      <header class="panel-heading">
        <h2 id="transcript-title" data-copy="transcript"></h2>
        <p id="transcript-help" data-copy="transcriptHelp"></p>
      </header>
      <div id="transcript-scroll" class="scrollable" tabindex="0" role="region" aria-labelledby="transcript-title">
        <p id="transcript-empty" data-copy="transcriptEmpty"></p>
        <p id="transcript-content" hidden><span id="committed"></span><span id="partial" data-label="provisional"></span></p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="bar">
      <span class="motto" data-copy="motto"></span>
      <div class="affiliation">
        <span data-copy="projectOf"></span>
        <a class="brand" href="https://ortogra.fi/"><img src="./assets/symbol.svg" alt="" width="23" height="23">ortogra.fi</a>
      </div>
      <nav class="footer-links">
        <a href="https://github.com/aaronFortuno/resso/blob/main/LICENSE">MIT</a>
        <button type="button" class="text-button" data-dialog="changelog" data-copy="version"></button>
        <button type="button" class="text-button" data-dialog="v4v">V4V</button>
      </nav>
    </div>
  </footer>
  <dialog id="changelog" aria-labelledby="changelog-title">
    <header class="dialog-heading">
      <h2 id="changelog-title" data-copy="changelog"></h2>
      <button type="button" class="close-button" data-close data-label="close">×</button>
    </header>
    <div class="dialog-body scrollable">
      <ol class="releases">
        <li><h3 data-copy="version"></h3><p data-copy="changes032"></p></li>
        <li><h3>v0.3.1</h3><p data-copy="changes031"></p></li>
        <li><h3>v0.3</h3><p data-copy="changes03"></p></li>
        <li><h3>v0.2</h3><p data-copy="changes02"></p></li>
        <li><h3>v0.1</h3><p data-copy="changes01"></p></li>
      </ol>
      <a href="https://github.com/aaronFortuno/resso/blob/main/CHANGELOG.md" data-copy="fullChangelog"></a>
    </div>
  </dialog>
  <dialog id="v4v" aria-labelledby="v4v-title">
    <header class="dialog-heading">
      <h2 id="v4v-title">Value for Value</h2>
      <button type="button" class="close-button" data-close data-label="close">×</button>
    </header>
    <div class="dialog-body scrollable v4v-body">
      <div>
        <p data-copy="v4vIntro"></p>
        <p data-copy="v4vSupport"></p>
        <p class="lightning-label">Lightning Network</p>
        <div class="lightning-address">
          <span id="lightning-address">aptswim903@walletofsatoshi.com</span>
          <button type="button" id="copy-lightning" class="icon-button" data-label="copyLightning">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <p id="copy-status" role="status"></p>
      </div>
      <a class="lightning-qr" href="lightning:LNURL1DP68GURN8GHJ7AMPD3KX2AR0VEEKZAR0WD5XJTNRDAKJ7TNHV4KXCTTTDEHHWM30D3H82UNVWQHKZUR5WDMKJMFEXQESLJTDDS" data-label="openLightning">
        <img src="./assets/lightning.svg" width="128" height="128" alt="">
      </a>
    </div>
  </dialog>
</body>
</html>
