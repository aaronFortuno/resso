<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practica la lectura en veu alta amb seguiment del text i transcripció al navegador.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ressò · ortogra.fi</title>
  <link rel="icon" href="./assets/symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#passage-scroll" data-copy="skip"></a>
  <header class="masthead">
    <div class="bar">
      <div class="identity">
        <h1>Ressò</h1>
        <span data-copy="subtitle"></span>
      </div>
      <a class="brand" href="https://ortogra.fi/"><img src="./assets/symbol.svg" alt="" width="26" height="26">ortogra.fi</a>
    </div>
  </header>
  <main class="workspace">
    <aside class="controls panel scrollable" aria-labelledby="controls-title">
      <h2 id="controls-title" data-copy="controls"></h2>
      <div class="task">
        <div class="clock">
          <span id="clock" aria-hidden="true">1:00</span>
          <progress id="progress" max="60" value="60" data-label="time"></progress>
        </div>
        <button id="action" type="button" data-copy="initialButton" disabled></button>
      </div>
      <p class="status" id="status" role="status" data-copy="initial"></p>
      <noscript><p>Activa el JavaScript per fer servir el micròfon.</p></noscript>
      <p class="privacy" data-copy="privacy"></p>
      <section class="report" id="report" aria-labelledby="report-title" hidden>
        <h3 id="report-title" tabindex="-1" data-copy="report"></h3>
        <p id="report-note"></p>
        <dl class="metrics" id="metrics" hidden>
          <div><dt data-copy="correctRate"></dt><dd id="rate"></dd></div>
          <div><dt data-copy="possibleErrors"></dt><dd id="errors"></dd></div>
          <div><dt data-copy="possibleRepairs"></dt><dd id="repairs"></dd></div>
          <div id="reread-metric" hidden><dt data-copy="rereads"></dt><dd id="reread-count"></dd></div>
        </dl>
        <ul class="details" id="details" hidden></ul>
      </section>
    </aside>
    <article class="paper panel" aria-labelledby="passage-title">
      <header class="panel-heading">
        <h2 id="passage-title"></h2>
        <label class="follow">
          <input id="follow" type="checkbox" checked>
          <span data-copy="follow"></span>
        </label>
      </header>
      <div id="passage-scroll" class="scrollable" tabindex="0" role="region" aria-labelledby="passage-title">
        <div id="passage"></div>
      </div>
      <ul class="legend" data-label="legend" tabindex="0">
        <li><span data-reading="match" data-copy="match"></span></li>
        <li><span data-reading="substitution" data-copy="substitution"></span></li>
        <li><span data-reading="omission" data-copy="omission"></span></li>
        <li><span data-reading="reread" data-copy="reread"></span></li>
        <li><span data-reading="corrected" data-copy="corrected"></span></li>
        <li><span data-provisional data-copy="provisional"></span></li>
      </ul>
    </article>
    <section class="transcript panel" aria-labelledby="transcript-title">
      <header class="panel-heading">
        <h2 id="transcript-title" data-copy="transcript"></h2>
        <p id="transcript-help" data-copy="transcriptHelp"></p>
      </header>
      <div id="transcript-scroll" class="scrollable" tabindex="0" role="region" aria-labelledby="transcript-title">
        <p id="transcript-empty" data-copy="transcriptEmpty"></p>
        <p id="transcript-content" hidden><span id="committed"></span><span id="partial" data-label="provisional"></span></p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="bar">
      <span data-copy="support"></span>
      <a href="https://github.com/aaronFortuno/lectura-en-veu-alta" data-copy="source"></a>
    </div>
  </footer>
</body>
</html>
